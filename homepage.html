<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="content.css">
</head>

<body>
    <header>
        <div class="header">
            <div class="left-section">
                <div>
                    <img class="hamburger-menu" src="/icons/hamburger-menu.svg" alt="hamburger-menu">
                </div>
                <div>
                    <img class="youtube-logo" src="/icons/youtube-logo.svg" alt="youtube-logo">
                </div>
            </div>
            <div class="middle-section">

                <input class="Search-bar" type="text" placeholder="Search">

                <button class="search-icons">
                    <img class="search-icon-image" src="/icons/search.svg" alt="search-icons">
                </button>
                <button class="voice-search-icon">
                    <img class="voice-icon-image" src="/icons/voice-search-icon.svg" alt="voice-search-icon">
                </button>
            </div>
            <div class="right-section">
                <img class="upload-image" src="/icons/upload.svg" alt="upload-icon">
                <img class="apps-icon" src="/icons/youtube-apps.svg" alt="apps-icon">
                <img class="notification-icon" src="/icons/notifications.svg" alt="notification-icon">
                <img class="profile-pictutes" src="/icons/my-channel.jpeg" alt="profile-pictute">
            </div>
        </div>
    </header>

    <div class="content-section">
        <div class="video-discription">
            <div class="thumbnails">
                <img class="video-thumbnail" src="/thumbnails/30 min.avif" alt="30-min-to-fix-your-life">
            </div>
            <div class="information">
                <div>
                    <img class="channel-logo" src="/profile_picture/gt_space.jpg" alt="logo">
                </div>
                <div>
                    <div>
                        <p>
                            Give me 30 Minutes &amp; Fix Your Life in 2026&excl;
                        </p>
                    </div>
                    <div>
                        <p>GT Space</p>
                    </div>
                    <div>
                        <p> 460k views&dot;2 weeks ago </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
